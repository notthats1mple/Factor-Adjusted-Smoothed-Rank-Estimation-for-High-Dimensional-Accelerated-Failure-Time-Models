name: Code review or reproducibility
description: Report a numerical, implementation, or reproducibility question.
title: "[Review] "
body:
  - type: input
    id: location
    attributes:
      label: Code location
      description: Commit, source file, function, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation or question
      description: State the issue and the assumptions or evidence relevant to it.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction or verification
      description: Include a fixed-array reproducer with expected and observed output. Keep private datasets and credentials out of the issue.
  - type: input
    id: environment
    attributes:
      label: Runtime environment
      description: R version, package versions, operating system, and BLAS/LAPACK. Remove personal filesystem paths before sharing.
